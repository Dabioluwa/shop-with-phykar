<!-- Colour theme, resolved before first paint so dark mode never flashes light.
     Must stay inline and in <head>: app.js loads at the end of <body> and would
     be far too late. A stored choice wins over the OS preference, so turning
     dark mode off is not silently undone on the next visit. -->
